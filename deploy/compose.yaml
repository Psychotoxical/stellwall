name: stellwall

services:
  app:
    image: ghcr.io/psychotoxical/stellwall:stable
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://stellwall:${POSTGRES_PASSWORD}@db:5432/stellwall
      PUBLIC_URL: ${PUBLIC_URL}
      TZ: ${TZ:-Europe/Berlin}
      # Notifications to Android phones: the Firebase service account file in ./secrets.
      FIREBASE_ACCOUNT_FILE: ${FIREBASE_ACCOUNT_FILE:-}
    volumes:
      - ./secrets:/run/stellwall:ro
    ports:
      - "127.0.0.1:8470:8080"

  db:
    image: postgres:19
    restart: unless-stopped
    environment:
      POSTGRES_USER: stellwall
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: stellwall
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stellwall -d stellwall"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db-data:
