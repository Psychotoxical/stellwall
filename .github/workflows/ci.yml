name: CI

# Every pull request needs an entry under [Unreleased] in CHANGELOG.md.
# Linux only. `ci-ok` sums up the run; it is the one check main requires.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: What changed?
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
      android: ${{ steps.files.outputs.android }}
      ios: ${{ steps.files.outputs.ios }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          CODE: '^(contract/|shared/|server/|web/|e2e/|package(-lock)?\.json$|tsconfig\.base\.json$|eslint\.config\.js$|playwright\.config\.ts$|Dockerfile$|\.dockerignore$|\.github/workflows/ci\.yml$)'
          ANDROID: '^(android/|contract/|scripts/(make-worlds\.py|solar-to-android\.mjs)$|\.github/workflows/ci\.yml$)'
          IOS: '^(ios/|contract/|scripts/make-worlds\.py$|\.github/workflows/ci\.yml$)'
        run: |
          case "$EVENT" in
            pull_request)
              files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename') ;;
            push)
              if [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
                files=ALL
              else
                files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" --jq '.files[].filename')
              fi ;;
            *)
              files=ALL ;;
          esac
          printf '%s\n' "$files"
          code=false
          if [ "$files" = ALL ] || grep -qE "$CODE" <<< "$files"; then
            code=true
          fi
          android=false
          if [ "$files" = ALL ] || grep -qE "$ANDROID" <<< "$files"; then
            android=true
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          ios=false
          if [ "$files" = ALL ] || grep -qE "$IOS" <<< "$files"; then
            ios=true
          fi
          echo "android=$android" >> "$GITHUB_OUTPUT"
          echo "ios=$ios" >> "$GITHUB_OUTPUT"
          echo "::notice::Tests: $code, Android: $android, iPhone: $ios"

  changelog:
    name: Changelog entry
    if: github.event_name == 'pull_request' && !endsWith(github.event.pull_request.user.login, '[bot]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git show "$BASE:CHANGELOG.md" > "$RUNNER_TEMP/base.md" 2>/dev/null || : > "$RUNNER_TEMP/base.md"
          python3 .github/release/check_changelog.py "$RUNNER_TEMP/base.md" CHANGELOG.md

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Release scripts
        run: python3 -m unittest discover -s .github/release -p "test_*.py"
      - run: npm run lint
      - run: npm run typecheck
      - name: actionlint
        run: |
          curl -fsSL -o actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color

  tests:
    name: Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"

  image:
    name: Container image builds
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: stellwall:ci
      - name: Image starts and answers
        run: |
          docker network create sw
          docker run -d --name db --network sw -e POSTGRES_USER=stellwall -e POSTGRES_PASSWORD=ci-only -e POSTGRES_DB=stellwall postgres:19
          for _ in $(seq 1 30); do docker exec db pg_isready -U stellwall -d stellwall && break; sleep 2; done
          docker run -d --name app --network sw -p 127.0.0.1:8470:8080 \
            -e DATABASE_URL=postgres://stellwall:ci-only@db:5432/stellwall -e PUBLIC_URL=http://localhost:8470 stellwall:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8470/api/health; then
              curl -fsS http://127.0.0.1:8470/api/setup/status | grep -q '"needed":true'
              curl -fsS http://127.0.0.1:8470/ | grep -q '<title>Stellwall</title>'
              exit 0
            fi
            sleep 2
          done
          docker logs app
          exit 1
      - name: Text recognition works in the image
        run: |
          # Ghostscript (part of OCRmyPDF) draws a page with text as a picture; OCR has to read it back.
          docker run --rm --entrypoint sh stellwall:ci -c '
            echo "/Helvetica findfont 48 scalefont setfont 100 200 moveto (Abschlag Rechnung) show showpage" > /tmp/t.ps &&
            gs -q -dNOPAUSE -dBATCH -sDEVICE=pnggray -r300 -g2550x1400 -sOutputFile=/tmp/scan.png /tmp/t.ps &&
            node --input-type=module -e "
              import { ocrmypdf } from \"/app/server/src/documents/ocr.ts\";
              const r = await ocrmypdf(\"/tmp/scan.png\", \"image/png\", AbortSignal.timeout(120000));
              console.log(JSON.stringify(r));
              if (!/Abschlag/.test(r.text) || !/Rechnung/.test(r.text) || r.pages !== 1) process.exit(1);
            "
          '

  android:
    name: Android app
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Colour worlds match the web app
        working-directory: .
        run: |
          python3 scripts/make-worlds.py
          git diff --exit-code web/src/theme/worlds.css android/app/src/main/java/app/stellwall/theme/Worlds.kt
      - name: Unit and screenshot tests, debug build
        run: ./gradlew --console=plain testDebugUnitTest verifyRoborazziDebug assembleDebug
      # On a screenshot mismatch the reference, the new picture and the difference side by side.
      - name: Screenshot comparison
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-screenshots
          path: android/app/build/outputs/roborazzi/
          retention-days: 7

  ios:
    name: iPhone app
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v7
      - name: Xcode and XcodeGen
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          brew install xcodegen
          xcodegen generate
      - name: Build and test on the simulator
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test -project Stellwall.xcodeproj -scheme Stellwall             -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5'             -resultBundlePath build/tests.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/test.log | grep -E "error:|warning: unre|Test Case.*(passed|failed)|Executed|BUILD|TEST" | tail -150
      - name: Upload pictures and results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-tests
          path: |
            ios/StellwallTests/**/__Snapshots__/
            ios/build/test.log
          retention-days: 3

  ci-ok:
    name: ci-ok
    needs: [changes, changelog, lint, tests, image, android, ios]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")')
          if [ -n "$bad" ]; then
            echo "::error::Not green: $bad"
            exit 1
          fi
          test "$(echo "$RESULTS" | jq -r '.changes.result')" = success
