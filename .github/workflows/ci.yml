name: CI

# Every pull request needs an entry under [Unreleased] in CHANGELOG.md.
# Linux only. `ci-ok` sums up the run; it is the one check main requires.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: What changed?
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          CODE: '^(shared/|server/|web/|e2e/|package(-lock)?\.json$|tsconfig\.base\.json$|eslint\.config\.js$|playwright\.config\.ts$|Dockerfile$|\.dockerignore$|\.github/workflows/ci\.yml$)'
        run: |
          case "$EVENT" in
            pull_request)
              files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename') ;;
            push)
              if [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
                files=ALL
              else
                files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" --jq '.files[].filename')
              fi ;;
            *)
              files=ALL ;;
          esac
          printf '%s\n' "$files"
          code=false
          if [ "$files" = ALL ] || grep -qE "$CODE" <<< "$files"; then
            code=true
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "::notice::Tests: $code"

  changelog:
    name: Changelog entry
    if: github.event_name == 'pull_request' && !endsWith(github.event.pull_request.user.login, '[bot]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git show "$BASE:CHANGELOG.md" > "$RUNNER_TEMP/base.md" 2>/dev/null || : > "$RUNNER_TEMP/base.md"
          python3 .github/release/check_changelog.py "$RUNNER_TEMP/base.md" CHANGELOG.md

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Release scripts
        run: python3 -m unittest discover -s .github/release -p "test_*.py"
      - run: npm run lint
      - run: npm run typecheck
      - name: actionlint
        run: |
          curl -fsSL -o actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color

  tests:
    name: Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"

  image:
    name: Container image builds
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: stellwall:ci

  ci-ok:
    name: ci-ok
    needs: [changes, changelog, lint, tests, image]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")')
          if [ -n "$bad" ]; then
            echo "::error::Not green: $bad"
            exit 1
          fi
          test "$(echo "$RESULTS" | jq -r '.changes.result')" = success
