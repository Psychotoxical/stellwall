name: After the release

# Runs when a release draft is published by hand: builds the container image of the tag
# (tags vX.Y.Z and stable) and brings main up to date through a pull request.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  image:
    name: Container image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # The Android app, signed with the family's key, goes into the image and onto the release.
      # Without the secrets the image is built without it and phones keep their version.
      - name: Android app
        id: app
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          GOOGLE_SERVICES_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_B64 }}
          STELLWALL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          STELLWALL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STELLWALL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$GOOGLE_SERVICES_B64" ]; then
            echo "::warning::Android secrets are missing; the image has no app for the phones"
            exit 0
          fi
          # The key files go away however the step ends.
          trap 'rm -f "$RUNNER_TEMP/release.jks" android/app/google-services.json' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf '%s' "$GOOGLE_SERVICES_B64" | base64 -d > android/app/google-services.json
          export STELLWALL_KEYSTORE="$RUNNER_TEMP/release.jks"
          (cd android && ./gradlew --console=plain assembleRelease)
          cp android/app/build/outputs/apk/release/app-release.apk android-dist/stellwall.apk
          python3 - <<'PY'
          import json, re
          v = re.search(r'"version":\s*"(\d+)\.(\d+)\.(\d+)"', open("package.json").read()).groups()
          code = int(v[0]) * 10000 + int(v[1]) * 100 + int(v[2])
          json.dump({"versionCode": code, "versionName": ".".join(v)}, open("android-dist/android.json", "w"))
          PY
          cat android-dist/android.json
          cp android-dist/stellwall.apk "$RUNNER_TEMP/stellwall-${TAG#v}.apk"
          echo "built=true" >> "$GITHUB_OUTPUT"
      # Only this step sees the token that can write to the repo, not the app build before it.
      # A failed upload leaves the image to be built: the phones update from the server.
      - name: Android app on the release
        if: steps.app.outputs.built == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$RUNNER_TEMP/stellwall-${TAG#v}.apk" --clobber
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/stellwall" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ env.TAG }}
            ${{ steps.img.outputs.name }}:stable

  iphone:
    name: iPhone app to TestFlight
    runs-on: macos-26
    timeout-minutes: 60
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      # Signed through the App Store Connect key (Xcode makes certificate and profile itself),
      # then uploaded to TestFlight. Without the secrets this job only warns.
      - name: Build and upload
        env:
          API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GOOGLE_SERVICE_INFO_B64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_B64 }}
          BUILD: ${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          # A failing xcodebuild must fail the step, not hide behind `tail`.
          set -o pipefail
          if [ -z "$API_KEY_B64" ] || [ -z "$API_KEY_ID" ] || [ -z "$API_ISSUER" ] || [ -z "$TEAM_ID" ]; then
            echo "::warning::Apple secrets are missing; no iPhone build this time"
            exit 0
          fi
          # The key files go away however the step ends.
          trap 'rm -f "$RUNNER_TEMP/AuthKey.p8" ios/Stellwall/GoogleService-Info.plist' EXIT
          printf '%s' "$API_KEY_B64" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          if [ -n "$GOOGLE_SERVICE_INFO_B64" ]; then
            printf '%s' "$GOOGLE_SERVICE_INFO_B64" | base64 -d > ios/Stellwall/GoogleService-Info.plist
          else
            echo "::warning::GoogleService-Info.plist is missing; this build has no notifications"
          fi
          sudo xcode-select -s /Applications/Xcode_26.6.app
          brew install xcodegen
          cd ios
          xcodegen generate
          VERSION="${TAG#v}"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$API_KEY_ID" -authenticationKeyIssuerID "$API_ISSUER")
          xcodebuild archive -project Stellwall.xcodeproj -scheme Stellwall -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/Stellwall.xcarchive DEVELOPMENT_TEAM="$TEAM_ID" MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" "${AUTH[@]}" | tail -40
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/Stellwall.xcarchive -exportPath build/export -exportOptionsPlist build/ExportOptions.plist "${AUTH[@]}" | tail -40

  sync:
    name: Bring main up to date
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Take over version and CHANGELOG
        run: |
          version=${TAG#v}
          git show "refs/tags/$TAG:CHANGELOG.md" > "$RUNNER_TEMP/released.md"
          python3 .github/release/bump_version.py sync "$version" "$RUNNER_TEMP/released.md"
          if git diff --quiet; then
            echo "::notice::main already has $version"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="release-sync/$version"
          git checkout -q -b "$branch"
          git add -u
          git commit -q -m "Main: version $version after the release"
          git push --force origin "$branch"
          title="Main: version $version after the release"
          body="Version $version is released. This brings its number and its CHANGELOG.md section to main; entries that went into the release leave [Unreleased]."
          if ! gh pr create --base main --head "$branch" --title "$title" --body "$body"; then
            echo "::warning::Could not open the pull request; open it by hand: https://github.com/$GITHUB_REPOSITORY/compare/main...$branch"
          fi
          echo "::notice::Approve the CI run of the pull request (Approve and run), then merge it"
          git push origin --delete "release/v$version" || true
